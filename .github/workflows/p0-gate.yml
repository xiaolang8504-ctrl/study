name: P0 delivery gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: SQL migration inventory
        run: python3 scripts/verify_managed_sql.py
      - name: Capture evaluator fixture
        run: python3 scripts/evaluate_capture.py --truth docs/ocr-samples/fixture-truth.json --predictions docs/ocr-samples/fixture-predictions.json
      - name: Backend tests and permission regression
        run: mvn -B -pl study-module-system -am test
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Whitespace check
        run: git diff-tree --check --root HEAD
      - name: Build identity
        run: python3 scripts/write_p0_build_manifest.py --output /tmp/p0-build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: p0-build-manifest
          path: /tmp/p0-build-manifest.json
